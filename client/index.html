<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Capabble Cloud helps institutions manage datesheets, rooms, duties, attendance, and answer-sheet workflows from one exam operations platform." />
    <meta name="keywords" content="capabble, examination operations, exam management, institution platform, CBSE" />
    <meta name="author" content="Capabble Cloud" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the colour theme before first paint; keep in step with src/utils/theme.ts -->
    <script>
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('cb-theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111314')
      })()
    </script>
    <!-- Staff panel and family portal install as separate apps; src/pwa.ts keeps this link in step with the route -->
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <script>
      if (/^#\/portal/.test(location.hash) || /[?&]app=family\b/.test(location.search)) {
        document.getElementById('app-manifest').setAttribute('href', '/family.webmanifest')
      }
    </script>
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Capabble" />
    
    <title>Capabble Cloud | Exam Operations Platform</title>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
