services:
  # Backend API Server
  - type: web
    name: capabble-server
    env: node
    rootDir: server
    buildCommand: npm install && npx puppeteer browsers install chrome --install-deps
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: CLIENT_URL
        # Replace YOUR_CLIENT_URL with your actual Render client URL
        # Example: https://capabble-client.onrender.com
        value: https://YOUR_CLIENT_URL.onrender.com
      # Add your other server environment variables in Render dashboard:
      # - MONGODB_URI
      # - JWT_SECRET
      # - JWT_EXPIRE
      # - PORT (usually auto-set by Render)

  # Frontend Static Site
  - type: web
    name: capabble-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        # Replace YOUR_SERVER_URL with your actual Render server URL
        # Example: https://capabble-server.onrender.com/api
        value: https://YOUR_SERVER_URL.onrender.com/api
      # Optional:
      # - key: VITE_APP_NAME
      #   value: Capabble
      # - key: VITE_APP_VERSION
      #   value: 1.0.0

  # Platform Admin Static Site
  - type: web
    name: capabble-admin
    env: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_PLATFORM_API_URL
        value: https://api.vpnbeni.com/api/admin
