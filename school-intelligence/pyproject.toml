[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capabble-school-intelligence"
version = "0.1.0"
description = "Capabble School Intelligence — canonical school identity and source-derived public data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.15.0",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
  "rapidfuzz>=3.10.0",
  "python-dotenv>=1.0.1",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
school-intel = "school_intel.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests that call live government APIs (opt-in)",
]
